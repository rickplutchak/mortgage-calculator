<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoneyPro Mortgage Calculator</title>

<style>

body{
    background:#000;
    color:#fff;
    font-family:Calibri,Arial,sans-serif;
    margin:0;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
    border:1px solid #444;
    border-radius:15px;
    padding:20px;
    background:#000;
}

.layout{
    display:grid;
    grid-template-columns:48% 52%;
    gap:20px;
}

@media(max-width:900px){
    .layout{
        grid-template-columns:1fr;
    }
}

h1{
    margin-top:0;
    font-size:28px;
}

.subtitle{
    color:#aaa;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:10px;
    margin-bottom:4px;
    font-size:14px;
    font-weight:600;
}

input,
select{
    width:100%;
    height:42px;
    padding:0 10px;
    border:1px solid #444;
    border-radius:6px;
    background:#111;
    color:white;
    font-size:15px;
    box-sizing:border-box;
}

.calc-btn{
    width:100%;
    margin-top:18px;
    height:46px;
    border:none;
    border-radius:8px;
    background:#22c55e;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.calc-btn:hover{
    background:#16a34a;
}

.chart-box{
    border:1px solid #444;
    border-radius:12px;
    padding:15px;
}

.chart-title{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-bottom:15px;
}

.chart-wrap{
    position:relative;
    width:260px;
    height:260px;
    margin:auto;
}

.center-payment{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}

.payment{
    font-size:42px;
    font-weight:bold;
}

.per-month{
    color:#bbb;
    font-size:18px;
}

.legend{
    margin-top:20px;
}

.legend-row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #333;
}

.legend-left{
    display:flex;
    align-items:center;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    margin-right:8px;
}

.contact{
    text-align:center;
    margin-top:20px;
}

.contact-button{
    background:#22c55e;
    padding:12px 24px;
    border-radius:8px;
    text-decoration:none;
    color:white;
    font-weight:bold;
    display:inline-block;
}

.footer{
    margin-top:15px;
    color:#ccc;
    line-height:1.8;
}

</style>
</head>

<body>

<div class="container">

<div class="layout">

<div>

<h1>MoneyPro Mortgage Calculator</h1>

<div class="subtitle">
Estimate your payment including taxes, insurance and HOA.
</div>

<label>Home Price</label>
<input id="homePrice" type="number" value="500000">

<label>Down Payment</label>
<input id="downPayment" type="number" value="100000">

<label>Interest Rate (%)</label>
<input id="interestRate" type="number" step="0.01" value="7.50">

<label>Loan Term</label>
<select id="loanTerm">
<option value="30">30-Year Fixed</option>
<option value="20">20-Year Fixed</option>
<option value="15">15-Year Fixed</option>
</select>

<label>Annual Property Taxes</label>
<input id="propertyTaxes" type="number" value="0">

<label>Annual Homeowners Insurance</label>
<input id="insurance" type="number" value="1750">

<label>Monthly HOA</label>
<input id="hoa" type="number" value="0">

<button class="calc-btn" onclick="calculateMortgage()">
Calculate Payment
</button>

</div>

<div class="chart-box">

<div class="chart-title">
Estimated Monthly Payment

</svg>

<div id="payment" class="payment">$2,943</div>

</div>

<div class="legend">

<div class="legend-left">

Principal & Interest
</div>
<div id="piVal">$2,797</div>
</div>

<div class="legend-row">
<div class="legend-left">
<div class="dot" style="background:#10b981;"></div>
Taxes
</div>
<div id="taxVal">$0</div>
</div>

<div class="legend-row">
<div class="legend-left">
<div class="dot" style="background:#ea580c;"></div>
Insurance
</div>
<div id="insVal">$146</div>
</div>
