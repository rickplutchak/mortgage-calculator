<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoneyPro Mortgage Calculator</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:20px;
background:#000;
color:#fff;
font-family:Calibri,Arial,sans-serif;
}

.container{
max-width:1180px;
margin:auto;
border:1px solid #444;
border-radius:12px;
padding:16px;
background:#000;
}

.layout{
display:grid;
grid-template-columns:42% 58%;
gap:14px;
}

@media(max-width:900px){
.layout{
grid-template-columns:1fr;
}
}

h1{
margin:0;
font-size:24px;
font-weight:600;
}

.subtitle{
margin-top:4px;
margin-bottom:14px;
color:#999;
font-size:13px;
}

label{
display:block;
margin-top:7px;
margin-bottom:3px;
font-size:12px;
font-weight:600;
}

input,
select{
width:100%;
height:30px;
background:#111;
border:1px solid #555;
border-radius:4px;
color:#fff;
padding:0 8px;
font-size:12px;
outline:none;
}

input:focus,
select:focus{
border-color:#22c55e;
}

.calc-btn{
width:100%;
height:36px;
margin-top:14px;
border:none;
border-radius:4px;
background:#22c55e;
color:#fff;
font-weight:700;
cursor:pointer;
font-size:14px;
}

.calc-btn:hover{
background:#16a34a;
}

.right-panel{
border:1px solid #444;
border-radius:10px;
padding:18px;
margin:6px;
}

.payment-title{
text-align:center;
font-size:22px;
font-weight:600;
margin-bottom:8px;
}

.chart-wrap{
position:relative;
width:250px;
height:250px;
margin:auto;
}

.center-text{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
width:170px;
}

.monthly-payment{
font-size:38px;
font-weight:700;
line-height:1;
}

.per-month{
color:#aaa;
font-size:15px;
margin-top:6px;
}

.legend{
margin-top:16px;
}

.legend-row{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 12px;
margin-bottom:4px;
border-bottom:1px solid #333;
transition:.2s;
}

.legend-row:hover{
background:#111;
border-radius:6px;
}

.legend-left{
display:flex;
align-items:center;
}

.dot{
width:12px;
height:12px;
border-radius:50%;
margin-right:8px;
}

.contact{
text-align:center;
margin-top:20px;
padding-top:10px;
}

.call-btn{
display:inline-block;
padding:10px 22px;
background:#22c55e;
color:white;
text-decoration:none;
border-radius:6px;
font-weight:bold;
}

.call-btn:hover{
background:#16a34a;
}

.footer{
margin-top:14px;
line-height:1.8;
color:#ccc;
font-size:14px;
}

a.email{
color:#22c55e;
text-decoration:none;
}

svg circle{
transition:.25s;
}

#seg1:hover,
#seg2:hover,
#seg3:hover,
#seg4:hover{
stroke-width:28;
}

</style>
</head>
<body>

<div class="container">

<div class="layout">

<div>

<h1>MoneyPro Mortgage Calculator</h1>

<div class="subtitle">
Estimate your monthly payment including taxes, insurance and HOA dues.
</div>

<label>Home Price</label>
<input id="homePrice" type="text" value="500,000">

<label>Down Payment</label>
<input id="downPayment" type="text" value="100,000">

<label>Interest Rate (%)</label>
<input id="interestRate" type="number" step="0.01" value="7.50">

<label>Loan Term</label>
<select id="loanTerm">
<option value="30">30-Year Fixed</option>
<option value="20">20-Year Fixed</option>
<option value="15">15-Year Fixed</option>
</select>

<label>Annual Property Taxes</label>
<input id="propertyTaxes" type="text" value="0">

<label>Annual Homeowners Insurance</label>
<input id="insurance" type="text" value="1,750">

<label>Monthly HOA Fees</label>
<input id="hoa" type="text" value="0">

<button class="calc-btn" onclick="calculateMortgage()">
Calculate Payment
</button>

</div>

<div class="right-panel">

<div class="payment-title">
Estimated Monthly Payment
</div>

<div class="chart-wrap">

<svg width="250" height="250">

<circle
cx="125"
cy="125"
r="85"
stroke="#222"
stroke-width="24"
fill="none"/>

<circle id="seg1"
cx="125"
cy="125"
r="85"
stroke="#0f766e"
stroke-width="24"
fill="none"
stroke-linecap="round"
transform="rotate(-90 125 125)"/>

<circle id="seg2"
cx="125"
cy="125"
r="85"
stroke="#10b981"
stroke-width="24"
fill="none"
stroke-linecap="round"
transform="rotate(-90 125 125)"/>

<circle id="seg3"
cx="125"
cy="125"
r="85"
stroke="#ea580c"
stroke-width="24"
fill="none"
stroke-linecap="round"
transform="rotate(-90 125 125)"/>

<circle id="seg4"
cx="125"
cy="125"
r="85"
stroke="#a21caf"
stroke-width="24"
fill="none"
stroke-linecap="round"
transform="rotate(-90 125 125)"/>

</svg>

<div class="center-text">

<div id="payment" class="monthly-payment">
$2,943
</div>

<div class="per-month">
Per Month
</div>

</div>

</div>

<div class="legend">

<div class="legend-row">
<div class="legend-left">
<div class="dot" style="background:#0f766e"></div>
Principal & Interest
</div>
