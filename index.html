<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoneyPro Mortgage Calculator</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:20px;
background:#000;
font-family:Calibri,Arial,sans-serif;
color:#fff;
}

.container{
max-width:1200px;
margin:auto;
border:1px solid #444;
border-radius:12px;
padding:15px;
background:#000;
}

.layout{
display:grid;
grid-template-columns:42% 58%;
gap:12px;
min-height:500px;
}

@media(max-width:900px){
.layout{
grid-template-columns:1fr;
}
}

.left-column{
display:flex;
flex-direction:column;
align-items:center;
width:100%;
padding-top:25px;
}

.left-column h1{
width:280px;
text-align:center;
margin:0 auto;
}

.left-column .subtitle{
width:280px;
text-align:center;
margin:6px auto 15px auto;
color:#999;
font-size:13px;
}

.left-column label{
width:280px;
text-align:left;
margin:6px 0 3px 0;
font-size:12px;
font-weight:600;
}

.form-fields{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
flex:1;
width:100%;
}  

input,
select{
width:280px;
height:38px;
margin:0 auto;
display:block;
background:#111;
border:1px solid #555;
border-radius:4px;
color:#fff;
padding:0 8px;
font-size:14px;
}

input:focus,
select:focus{
outline:none;
border-color:#22c55e;
}

.calc-btn{
width:280px;
height:38px;
display:block;
margin:15px auto 0 auto;
border:none;
border-radius:4px;
background:#22c55e;
color:#fff;
font-size:14px;
font-weight:bold;
cursor:pointer;
}

.calc-btn:hover{
background:#16a34a;
}

.right-panel{
border:1px solid #444;
border-radius:10px;
padding:20px;
margin:12px;
}

.payment-title{
text-align:center;
font-size:22px;
font-weight:600;
margin-bottom:15px;
}

.chart-wrap{
display:flex;
justify-content:center;
margin-bottom:20px;
}

.donut{
width:240px;
height:240px;
border-radius:50%;
position:relative;
transition:.3s;
}

.donut:hover{
transform:scale(1.03);
}

.donut-center{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:170px;
height:170px;
border-radius:50%;
background:#000;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.payment{
font-size:50px;
font-weight:700;
line-height:1;
}

.permonth{
font-size:15px;
color:#999;
margin-top:5px;
}

.legend{
margin-top:5px;
}

.legend-row{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
border-bottom:1px solid #333;
transition:.2s;
}

.legend-row:hover{
background:#111;
border-radius:6px;
}

.legend-left{
display:flex;
align-items:center;
}

.dot{
width:12px;
height:12px;
border-radius:50%;
margin-right:8px;
}

.contact{
text-align:center;
margin-top:25px;
}

.call-btn{
display:inline-block;
background:#22c55e;
padding:10px 22px;
color:white;
text-decoration:none;
border-radius:6px;
font-weight:bold;
}

.call-btn:hover{
background:#16a34a;
}

.footer{
margin-top:15px;
color:#ccc;
line-height:1.8;
font-size:14px;
}

.footer a{
color:#22c55e;
text-decoration:none;
}

.piColor{background:#8B5CF6;}
.taxColor{background:#22C55E;}
.insColor{background:#F97316;}
.hoaColor{background:#065F46;}

</style>
</head>
<body>

<div class="container">

<div class="layout">

<div class="left-column">

<h1>MoneyPro Mortgage Calculator</h1>

<div class="subtitle">
Estimate your payment including taxes, insurance and HOA dues.
</div>
<label>Home Price</label>
<input id="homePrice" value="500,000">

<label>Down Payment</label>
<input id="downPayment" value="100,000">

<label>Interest Rate (%)</label>
<input id="interestRate" type="number" step=".01" value="7.50">

<label>Loan Term</label>
<select id="loanTerm">
<option value="30">30-Year Fixed</option>
<option value="20">20-Year Fixed</option>
<option value="15">15-Year Fixed</option>
</select>

<label>Annual Property Taxes</label>
<input id="propertyTaxes" value="6,000">

<label>Annual Homeowners Insurance</label>
<input id="insurance" value="1,750">

<label>Monthly HOA Fees</label>
<input id="hoa" value="150">

<button class="calc-btn" onclick="calculateMortgage()">
Calculate Payment
</button>

</div>
  
<div class="left-column">
<div class="right-panel">

<div class="payment-title">
Estimated Monthly Payment
</div>

<div class="chart-wrap">

<div id="donut" class="donut">

<div class="donut-center">

<div id="payment" class="payment">
$0
</div>

<div class="permonth">
Per Month
</div>

</div>

</div>

</div>

<div class="legend">

<div class="legend-row">
<div class="legend-left">
<div class="dot piColor"></div>
Principal & Interest
</div>
<div id="piVal">$0</div>
</div>

<div class="legend-row">
<div class="legend-left">
<div class="dot taxColor"></div>
Taxes
</div>
<div id="taxVal">$0</div>
</div>

<div class="legend-row">
<div class="legend-left">
<div class="dot insColor"></div>
Insurance
</div>
<div id="insVal">$0</div>
</div>

<div class="legend-row">
<div class="legend-left">
<div class="dot hoaColor"></div>
HOA
</div>
<div id="hoaVal">$0</div>
</div>

</div>

<div class="contact">


Call Rick • 805‑501‑0104
</a>

<div class="footer">

<strong>Rick Plutchak</strong><br>

NMLS #333242<br>

<a href="mailto:Rickyp@monepro.com">
Rickyp@monepro.com
</a>

</div>

</div>

</div>

</div>

</div>

<script>

function cleanNumber(v){
return Number(String(v).replace(/,/g,''));
}

function money(v){
return "$"+Math.round(v).toLocaleString();
}

document.querySelectorAll(
'#homePrice,#downPayment,#propertyTaxes,#insurance,#hoa'
).forEach(function(el){

el.addEventListener('focus',function(){
this.value=this.value.replace(/,/g,'');
});

el.addEventListener('blur',function(){

let n=cleanNumber(this.value);

if(!isNaN(n)){
this.value=n.toLocaleString();
}

calculateMortgage();

});

});

function calculateMortgage(){

let hp=cleanNumber(
document.getElementById('homePrice').value
);

let dp=cleanNumber(
document.getElementById('downPayment').value
);

let taxesYear=cleanNumber(
document.getElementById('propertyTaxes').value
);

let insuranceYear=cleanNumber(
document.getElementById('insurance').value
);

let hoaFee=cleanNumber(
document.getElementById('hoa').value
);

let rate=
parseFloat(
document.getElementById('interestRate').value
)/100/12;

let years=
parseFloat(
document.getElementById('loanTerm').value
);

let loan=hp-dp;
let n=years*12;

let pi=
loan *
(rate*Math.pow(1+rate,n)) /
(Math.pow(1+rate,n)-1);

let taxes=taxesYear/12;
let monthlyInsurance=insuranceYear/12;

let total=
pi+
taxes+
monthlyInsurance+
hoaFee;

document.getElementById('payment').innerHTML=
money(total);

let p1=(pi/total)*100;
let p2=(taxes/total)*100;
let p3=(monthlyInsurance/total)*100;
let p4=(hoaFee/total)*100;

document.getElementById('piVal').innerHTML=
money(pi);

document.getElementById('taxVal').innerHTML=
money(taxes);

document.getElementById('insVal').innerHTML=
money(monthlyInsurance);

document.getElementById('hoaVal').innerHTML=
money(hoaFee);

document.getElementById('donut').style.background=
`conic-gradient(
#8B5CF6 0% ${p1}%,
#000 ${p1}% ${p1+1}%,
#22C55E ${p1+1}% ${p1+p2}%,
#000 ${p1+p2}% ${p1+p2+1}%,
#F97316 ${p1+p2+1}% ${p1+p2+p3}%,
#000 ${p1+p2+p3}% ${p1+p2+p3+1}%,
#065F46 ${p1+p2+p3+1}% 100%
)`;

}

calculateMortgage();

</script>

</body>
</html>
